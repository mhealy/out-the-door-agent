services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OTD_APP_NAME: ${OTD_APP_NAME:-OutTheDoor API}
      OTD_ENVIRONMENT: ${OTD_ENVIRONMENT:-development}
      OTD_DATABASE_URL: sqlite:////data/out_the_door.db
      OTD_LANGGRAPH_CHECKPOINT_PATH: /data/out_the_door_checkpoints.db
      OTD_CORS_ORIGINS: '${OTD_CORS_ORIGINS:-["http://localhost:5173"]}'
      OTD_QUOTE_EXTRACTION_MODEL: ${OTD_QUOTE_EXTRACTION_MODEL:-gpt-5.6}
      OTD_FOLLOWUP_DRAFTING_MODEL: ${OTD_FOLLOWUP_DRAFTING_MODEL:-gpt-5.6}
      OTD_RESEARCH_SYNTHESIS_MODEL: ${OTD_RESEARCH_SYNTHESIS_MODEL:-gpt-5.6}
      OTD_OPENAI_API_KEY: ${OTD_OPENAI_API_KEY:-}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://localhost:8000/health", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  backend-data:
